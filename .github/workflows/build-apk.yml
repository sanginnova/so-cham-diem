name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🔄 Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: ⚙️ Compile Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: 📋 Upload Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: gradle_output.txt
          retention-days: 1

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: So-Cham-Diem-Hang-Ngay-v1.0.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
